<!DOCTYPE html>
<html>
<head>
    <title>Test - Transaction Oluştur</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Test Transaction Oluştur</h1>
        
        <button onclick="createTestTransaction()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
            Test Transaction Oluştur
        </button>
        
        <div id="result" class="mt-4 p-4 bg-white rounded shadow"></div>
    </div>

    <script>
        async function createTestTransaction() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Oluşturuluyor...</p>';
            
            try {
                const response = await fetch('http://localhost:5800/api/marketplace/create-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mpUser: "demo_mp",
                        mpPassword: "demo123",
                        order: {
                            successUrl: "https://marketplace.com/success",
                            rejectUrl: "https://marketplace.com/reject",
                            orderId: "TEST-" + Date.now(),
                            totalAmount: 15000,
                            items: [{
                                category: "test ürün",
                                unitPrice: 15000,
                                tax: 20
                            }]
                        }
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const transactionId = data.data.transactionId;
                    resultDiv.innerHTML = `
                        <div class="space-y-2">
                            <p class="text-green-600 font-semibold">✅ Transaction oluşturuldu!</p>
                            <p><strong>Transaction ID:</strong> ${transactionId}</p>
                            <p><strong>Redirect URL:</strong> <a href="${data.data.redirectUrl}" class="text-blue-600 hover:underline">${data.data.redirectUrl}</a></p>
                            <p><strong>HTML Sayfa Link:</strong> <a href="http://localhost:5800/transaction.html#${transactionId}" class="text-blue-600 hover:underline" target="_blank">http://localhost:5800/transaction.html#${transactionId}</a></p>
                            <button onclick="window.open('http://localhost:5800/transaction.html#${transactionId}', '_blank')" class="mt-2 bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700">
                                Transaction Sayfasını Aç
                            </button>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="text-red-600">❌ Hata: ${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="text-red-600">❌ Network hatası: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
