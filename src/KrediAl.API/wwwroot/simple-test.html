<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Simple Transaction Test</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Transaction ID:</label>
            <input type="text" id="transactionId" value="9a01e908-21d1-42ee-a785-176c9da02e0b" 
                   class="w-full p-2 border rounded">
        </div>
        
        <button onclick="testTransaction()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
            Transaction Detaylarını Getir
        </button>
        
        <div id="result" class="mt-6 p-4 bg-white rounded shadow"></div>
        <div id="error" class="mt-4 p-4 bg-red-100 text-red-700 rounded hidden"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5800/api';
        
        function showResult(content) {
            document.getElementById('result').innerHTML = content;
            document.getElementById('error').classList.add('hidden');
        }
        
        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').classList.remove('hidden');
        }
        
        async function testTransaction() {
            const transactionId = document.getElementById('transactionId').value;
            
            if (!transactionId) {
                showError('Transaction ID gereklidir');
                return;
            }
            
            showResult('Yükleniyor...');
            
            try {
                console.log('API çağrılıyor:', API_BASE + '/transaction/' + transactionId);
                
                const response = await fetch(API_BASE + '/transaction/' + transactionId);
                console.log('Response status:', response.status);
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok) {
                    showResult(`
                        <h3 class="font-semibold text-green-600">✅ Başarılı!</h3>
                        <div class="mt-2 space-y-2">
                            <p><strong>Order ID:</strong> ${data.data.orderId}</p>
                            <p><strong>Total Amount:</strong> ₺${data.data.totalAmount.toLocaleString()}</p>
                            <p><strong>Status:</strong> ${data.data.status}</p>
                            <p><strong>Can Continue:</strong> ${data.data.canContinue ? 'Yes' : 'No'}</p>
                            <div class="mt-3">
                                <h4 class="font-semibold">Items:</h4>
                                ${data.data.items.map(item => `
                                    <div class="ml-4">
                                        • ${item.category} - ₺${item.unitPrice.toLocaleString()}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `);
                } else {
                    showError('Hata: ' + data.message);
                }
            } catch (error) {
                console.error('Network error:', error);
                showError('Network hatası: ' + error.message);
            }
        }
        
        // Sayfa yüklendiğinde otomatik test
        window.addEventListener('load', () => {
            console.log('Sayfa yüklendi');
            testTransaction();
        });
    </script>
</body>
</html>
